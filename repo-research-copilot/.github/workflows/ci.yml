name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        limiter_backend: [ memory, redis ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run memory limiter test suite
        if: matrix.limiter_backend == 'memory'
        run: |
          pytest -q tests/test_api_security.py

      - name: Run redis limiter unit suite
        if: matrix.limiter_backend == 'redis'
        run: |
          pytest -q tests/test_rate_limit_redis.py

  integration-redis:
    runs-on: ubuntu-latest
    needs: test-matrix
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run redis integration test suite
        env:
          RUN_REDIS_INTEGRATION: "1"
          TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -q tests/test_api_redis_integration.py

  container-security:
    runs-on: ubuntu-latest
    needs: [ test-matrix, integration-redis ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce base-image policy
        run: |
          python scripts/enforce_container_policy.py

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: |
          docker build -t repo-research-copilot:ci .

      - name: Trivy scan (vulnerability gate)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: repo-research-copilot:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
