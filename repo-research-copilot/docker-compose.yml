name: repo-research-copilot

services:
  api:
    profiles: ["phase2"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      API_KEYS: ${API_KEYS:-old-key,new-key}
      API_KEY_HEADER_NAME: ${API_KEY_HEADER_NAME:-X-API-Key}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      REDIS_URL: redis://redis:6379/0
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_SERVICE_NAME: ${TRACING_SERVICE_NAME:-repo-research-copilot}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      INDEX_PATH: /app/data/index
    volumes:
      - ./data/index:/app/data/index:ro
    ports:
      - "8010:8010"
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  redis:
    profiles: ["phase2"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    profiles: ["phase2"]
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    profiles: ["phase2"]
    image: jaegertracing/all-in-one:1.61.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
